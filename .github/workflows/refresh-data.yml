name: Refresh Free Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-free-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and validate feeds
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python scripts/refresh_free_data.py; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep 300; fi
          done
          exit 1
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/live; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git commit -m "data: refresh free market feeds"
          git push
